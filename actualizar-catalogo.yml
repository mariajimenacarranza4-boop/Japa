# Actualización recurrente automática (Persona C).
# Corre el scraping paralelo (orquestador de A con los scrapers de B), valida el resultado, lo guarda en web/data/catalogo.json,
# deja registro de la corrida en web/data/ejecuciones.json y vuelve a publicar el sitio.
#
# Intervalo: cada 12 horas (00:17 y 12:17 hora de Costa Rica). Justificación en docs/Documentacion_Tecnica.md, sección 4.
# Modo: variable del repositorio MODO_CATALOGO = "real" (scraping de A y B) o "mock" (datos de ejemplo).
#       Se cambia en Settings → Secrets and variables → Actions → Variables, sin tocar código.
name: Actualizar catálogo

on:
  schedule:
    # GitHub usa UTC. Costa Rica = UTC-6 → 06:17 y 18:17 UTC = 00:17 y 12:17 en CR.
    # Minuto 17 (y no :00) porque a la hora en punto GitHub retrasa más los cron.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de esta corrida (auto = usa la variable MODO_CATALOGO)"
        type: choice
        options: [auto, real, mock]
        default: auto

permissions:
  contents: write   # para guardar el catálogo nuevo en el repo
  pages: write      # para el despliegue
  id-token: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false   # si una corrida tarda, la siguiente espera; nunca dos escribiendo a la vez

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Decidir modo
        id: modo
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ] || [ "$MODO" = "auto" ]; then MODO="${{ vars.MODO_CATALOGO }}"; fi
          if [ -z "$MODO" ]; then MODO="real"; fi   # A ya entregó su comando: por defecto, datos reales
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo de esta corrida: $MODO (evento: ${{ github.event_name }})"

      - name: Instalar .NET 8
        if: steps.modo.outputs.modo == 'real'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Scraping real (orquestador de A + scrapers de B)
        if: steps.modo.outputs.modo == 'real'
        env:
          # Secretos/variables del programador: nunca escritos en el repositorio.
          # Si un secreto no existe, GitHub entrega texto VACÍO; B usa su valor por defecto solo si la variable NO existe,
          # así que se exportan más abajo únicamente cuando traen valor.
          SECRETO_CONTACTO: ${{ secrets.SCRAPER_CONTACTO }}
          SECRETO_NINTENDO: ${{ secrets.NINTENDO_ALGOLIA_KEY }}
          # Tiendas a apagar sin recompilar (ej. "Epic Games Store" si CheapShark fallara). Por defecto ninguna.
          TIENDAS_DESACTIVADAS: ${{ vars.TIENDAS_DESACTIVADAS || '' }}
          SALIDA: ${{ runner.temp }}/salida
          # Comando de A (se corre DESDE la carpeta A_Orquestador; en Linux las rutas usan /).
          # datos/catalogo_a.json queda guardado en el repo: A lo lee en la corrida siguiente para conservar
          # el último dato bueno de cada fuente que falle. Se puede cambiar con la variable COMANDO_SCRAPING.
          COMANDO: ${{ vars.COMANDO_SCRAPING || 'dotnet run -c Release -- real ../ScraperJuegos/Data/juegos.csv 500 salida=../datos/catalogo_a.json' }}
        run: |
          mkdir -p "$SALIDA" datos
          if [ -n "$SECRETO_CONTACTO" ]; then export SCRAPER_CONTACTO="$SECRETO_CONTACTO"; else echo "::warning::Falta el secreto SCRAPER_CONTACTO (correo del equipo para el User-Agent)"; fi
          if [ -n "$SECRETO_NINTENDO" ]; then export NINTENDO_ALGOLIA_KEY="$SECRETO_NINTENDO"; fi
          if [ -z "$TIENDAS_DESACTIVADAS" ]; then unset TIENDAS_DESACTIVADAS; fi
          # Valores válidos de los filtros (comando de B) -> salida/valores_validos.json
          dotnet run --project ScraperJuegos -c Release -- catalogos --salida "$SALIDA" || echo "::warning::No se pudieron exportar los valores válidos"
          if [ -f "$SALIDA/valores_validos.json" ]; then cp "$SALIDA/valores_validos.json" web/data/; fi
          INICIO=$(date +%s)
          echo "Ejecutando en A_Orquestador: $COMANDO"
          # Si el comando falla, igual se intenta publicar lo que haya: publicar_catalogo.py decide si es válido.
          ( cd A_Orquestador && eval "$COMANDO" ) 2>&1 | tee "$SALIDA/consola_scraping.txt" || true
          echo "DURACION=$(( $(date +%s) - INICIO ))" >> "$GITHUB_ENV"
          echo "NUEVO=datos/catalogo_a.json" >> "$GITHUB_ENV"
          # Logs de A y B como evidencia (se suben como artefacto más abajo).
          cp A_Orquestador/log_fallos.txt "$SALIDA/" 2>/dev/null || true
          # Resumen corto de fallos por fuente (queda en el repo para revisar por qué falló una tienda).
          python3 scripts/resumir_fallos.py A_Orquestador/log_fallos.txt web/data/fallos_ultima_corrida.txt || true

      - name: Datos de ejemplo (mock, solo si MODO_CATALOGO = mock)
        if: steps.modo.outputs.modo != 'real'
        run: |
          INICIO=$(date +%s)
          python3 scripts/generar_catalogo_mock.py --repo ScraperJuegos/Data/juegos.csv --salida "$RUNNER_TEMP/catalogo.json"
          echo "DURACION=$(( $(date +%s) - INICIO ))" >> "$GITHUB_ENV"
          echo "NUEVO=$RUNNER_TEMP/catalogo.json" >> "$GITHUB_ENV"

      - name: Validar y publicar catálogo
        id: publicar
        run: |
          python3 scripts/publicar_catalogo.py \
            --nuevo "$NUEVO" --destino web/data \
            --min-juegos "${{ vars.MIN_JUEGOS || 1 }}" \
            --modo "${{ steps.modo.outputs.modo }}" \
            --evento "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --duracion-seg "$DURACION"

      - name: Guardar log de fallos como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-scraping-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/salida/
            web/data/ejecuciones.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit de los datos nuevos
        # always(): aunque el catálogo se rechace, se guarda ejecuciones.json (evidencia de la corrida).
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El archivo de trabajo de A solo se guarda si la publicación fue aceptada.
          if [ "${{ steps.publicar.outcome }}" != "success" ]; then git checkout -- datos 2>/dev/null || true; git clean -fdq datos; fi
          git add web/data datos
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Catálogo: actualización ${{ github.event_name == 'schedule' && 'automática' || 'manual' }} (${{ steps.modo.outputs.modo }}, run ${{ github.run_id }})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::No se pudo hacer push de los datos"; exit 1

  desplegar:
    needs: scraping
    # Se despliega aunque el catálogo se haya rechazado: el sitio sigue con el último dato bueno
    # y el pie de página muestra la corrida más reciente.
    if: always() && needs.scraping.result != 'cancelled'
    uses: ./.github/workflows/desplegar-sitio.yml
